<div class="app-window" id="IntervalApp">
  <div class="app-header"><span class="app-title">⏱️ Interval Timer</span><div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div></div>
  <div class="app-content">
    <div class="iv">
      <div class="iv-set"><label>Work (s)<input id="iv-work" type="number" min="5" value="30"></label><label>Rest (s)<input id="iv-rest" type="number" min="0" value="15"></label><label>Rounds<input id="iv-rounds" type="number" min="1" value="8"></label></div>
      <div id="iv-phase" class="iv-phase">Ready</div>
      <div id="iv-time" class="iv-time">00:30</div>
      <div id="iv-round" class="iv-round"></div>
      <div class="iv-btns"><button id="iv-start">Start</button><button id="iv-reset">Reset</button></div>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
